[tox]
minversions = 3.8.0
envlist = py38, py39, py310, py311, flake8
isolated_build = true

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
extras = 
    test
    cli
commands =
    pytest --cov-report term-missing --basetemp={envtmpdir}
    coverage combine

[testenv:flake8]
basepython = python3.9
deps = flake8
commands = flake8 multi_imbalance tests
