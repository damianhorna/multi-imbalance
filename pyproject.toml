[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-imbalance"
description = "Python package for tackling multiclass imbalance problems."
version = "0.1.0"
maintainers = [
    { name = "Damian Horna, Kamil Pluciński, Hanna Klimczak, Jacek Grycza, Jan Kozłowski, Maciej Falbogowski, Adam Wojciechowski, Mateusz Woźny", email = "horna.damian@gmail.com" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.9",

]
dependencies = [
    "numpy>=1.23.4,<=1.26",
    "scikit-learn>=1.1.0,<=1.4",
    "pandas>1.5.1,<=2.2",
    "imbalanced-learn~=0.12",
    "seaborn~=0.13.2",
    "matplotlib>=3.6.2,<=3.9",
    "scikit-posthocs~=0.7",
    "pydantic~=2.7",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "coverage"]
lint = ["flake8"]
dev = ["tox"]
notebooks = [
    "ipython",
    "ipykernel",
    "tqdm",
    "jupyter",
]
cli = [
    "click~=8.1.3"
]
all = [
    "multi-imbalance[test]",
    "multi-imbalance[lint]",
    "multi-imbalance[dev]",
    "multi-imbalance[notebooks]",
    "multi-imbalance[cli]"
]

[project.urls]
homepage = "https://github.com/damian-horna/multi-imbalance"
documentation = "https://github.com/damian-horna/multi-imbalance/blob/master/README.md"

[tool.pytest.ini_options]
addopts = "--cov=multi_imbalance"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["multi_imbalance*"]

[tool.black]
line-length = 140
